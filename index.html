<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Clon Nintendo</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- TOP BAR -->
    <div class="topbar">
      <!-- LOGO -->
      <div class="logo">
        <img src="./fotos/nintendo-logo.png" alt="Nintendo Switch Logo" />
      </div>
      <div class="top-actions">
        <div class="action">
          <i class="fa-solid fa-magnifying-glass"></i>
          <a>Buscar</a>
        </div>
        <div class="action">
          <i class="fa-regular fa-heart"></i>
          <a>Lista deseos</a>
        </div>
        <div class="action">
          <i class="fa-solid fa-user"></i>
          <a>Iniciar sesión</a>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR FLEX PARA SIDEBAR + MAIN -->
    <div class="contenedor-flex">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="side-item">
          <i class="fa-solid fa-star"></i><span>Juegos</span>
        </div>
        <div class="side-item">
          <i class="fa-solid fa-gamepad"></i><span>Hardware</span>
        </div>
        <div class="side-item">
          <img
            src="./fotos/Nintendo_switch.png"
            alt="Switch Online"
            id="N_S"
          /><span>Nintendo Switch Online</span>
        </div>
        <div class="side-item">
          <i class="fa-solid fa-shopping-cart"></i><span>Nintendo eShop</span>
        </div>
        <div class="side-item">
          <img
            src="./fotos/nintendo_store.png"
            alt="My Nintendo Store"
            id="M_N_S"
          /><span>My Nintendo Store</span>
        </div>
        <div class="side-item">
          <i class="fa-solid fa-headset" id="ayuda"></i><span>Ayuda</span>
        </div>
        <div class="side-item">
          <i class="fa-regular fa-newspaper"></i><span>Ayuda</span>
        </div>
        <div class="side-item">
          <i class="fa-solid fa-users"></i><span>Síguenos</span>
        </div>
        <div class="side-item">⋯</div>
      </div>
      <!-- MAIN -->
      <div class="main">
        <!-- Carrusel -->
        <div class="carousel">
          <div class="slide">
            <div class="carousel-container">
              <img src="" alt="" id="carousel-img" />
              <div class="carousel-caption">
                <h2 id="carousel-text"></h2>
                <a href="#" class="caption-button">¡Siguelo aquí!</a>
              </div>
            </div>
          </div>
          <div class="arrow left">‹</div>
          <div class="arrow right">›</div>
          <div class="indicators" id="indicators-container"></div>
        </div>
        <!-- Novedades -->
        <div class="section">
          <h2>Novedades</h2>
          <div class="tabs">
            <div class="tab active">Destacadas</div>
            <div class="tab">Noticias</div>
          </div>

          <!--Noticia principal-->
          <article class="noticia-principal">
            
          </article>

          <!--Mini noticias grid-->
          <div class="mini-noticias-grid">
            
          </div>
        </div>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
